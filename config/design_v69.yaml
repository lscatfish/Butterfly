# ============================================================
# Butterfly MAV — v6.9 设计参数（单一权威来源）
# ============================================================
#
# 本文件是所有仿真脚本的参数基准。修改此文件即可影响所有模块。
# 读取方式：
#   from src.config import get_design, get_mech_params
#   config = get_design()          # 完整 dict，同原 DESIGN_v69
#   mech   = get_mech_params()     # 仅机构参数 dict
#
# 参数来源：docs/机械结构更新报告.md（2026-07-03）
# 新机构：摆幅 ~99°，急回系数 K≈1.0，Grashof 条件满足
# 气动设计点：α_f=60°, α_b=3°, phase=-15°（扫参最优）
#
# 坐标系（与 SolidWorks 对齐）：
#   X : 左右（右为正）
#   Y : 上下（上为正）
#   Z : 前后（前为正）
# 翅膀拍动轴：平行于 Z
# 机身俯仰轴：平行于 X（过总质心）
# ============================================================

version: "6.9"
description: >
  新四连杆机构参数（摆幅99°）+ 气动设计点优化（α_f=60°, α_b=3°, phase=-15°）。
  翅膀面积来自实测（翅膀的面积.xlsx），材料：PE薄膜膜面 + 碳纤维支撑杆 + 铝合金结构。

# ---- 四连杆机构几何参数 ----
# 曲柄摇杆机构，所有长度单位 mm
# Grashof: 3.8 + 7.79 = 11.59 ≤ 7.1 + 5.0 = 12.10 ✅
mechanism:
  a: 7.6             # 翅膀转轴 A 的 y 坐标 [mm]
  b: 1.71            # 圆心 B 的 x 坐标 [mm]
  R: 3.8             # 曲柄半径 [mm]（新：+52%）
  c: 7.1             # 连杆 P1-P2 长度 [mm]
  l: 5.0             # 摇杆/翅膀杆 A-P2 长度 [mm]
  phi_offset_deg: 0.0  # 翅膀安装基准偏角 [°]（新机构无偏移）
  rotation: cw         # 曲柄旋转方向：cw=顺时针, ccw=逆时针

# ---- 气动设计参数 ----
# 攻角定义（文献[32]）：α = η（相对拍动平面），上下拍符号翻转用 tanh 平滑
# Clap-and-Fling：速度-位置耦合（Lighthill 1973），k_max=0.3
# 设计点：α_f=60°, α_b=3°, phase=-15° 通过 4 参数单变量扫参确定
aero:
  alpha_front_deg: 60.0   # 前翅安装角 [°]（新：+15°, L/W=4.43, peak=65.8°）
  alpha_back_deg: 3.0     # 后翅安装角 [°]（新：-5°, 最稳定, peak=54.4°）
  phase_diff_deg: -15.0   # 前后翅相位差 [°]（新：+5°, 稳定区间中心）
  k_clap: 0.3             # Clap-and-Fling k_max（速度耦合系数）
  c_damp: 0.0005          # 俯仰气动阻尼 [N·m·s/rad]
  k_3d: 0.7               # 3D 效应修正系数
  C_rot: 1.5              # 旋转力系数
  r_rot: 0.5              # 旋转力无量纲矩臂

# ---- 物理常数 ----
# 坐标系：X=左右(右+), Y=上下(上+), Z=前后(前+)；俯仰轴=X，拍动轴=Z
# 质量、惯量、铰链位置来自 SolidWorks 质量属性（2026-07-06）
physical:
  f: 17.0                  # 扑动频率 [Hz]
  rho: 1.225               # 空气密度 [kg/m³]，标准海平面
  m_total: 0.023            # 总质量 [kg]（SW 实测 23 g）
  I_xx: 4.0668e-5           # 绕 X 轴（俯仰轴）转动惯量 [kg·m²]
  x_hinge_right: 0.009625   # 右翅铰链 X 坐标（相对 CG，右为正）[m]
  x_hinge_left: -0.005935   # 左翅铰链 X 坐标（相对 CG，右为正）[m]
  y_hinge_rel: 0.002171     # 铰链 Y 坐标（相对 CG，上为正）[m]
  z_front: 0.036515         # 前翅力作用点 Z 坐标（相对 CG，前为正）[m]
  z_back: -0.048012         # 后翅力作用点 Z 坐标（相对 CG，前为正）[m]
  g: 9.81                   # 重力加速度 [m/s²]，方向 -Y

# ---- 数值仿真参数 ----
# dt=10μs 用于精度验证, dt=50μs 用于参数扫描（提速 5×）
numerical:
  dt: 1.0e-5             # 时间步长 [s]（精度模式）
  t_end: 10.0            # 仿真总时长 [s]
  theta0_deg: 0.0        # 初始俯仰角 [°]
  steady_start: 5.0      # 稳态平均开始时间 [s]

# ---- 笛卡尔积扫参网格 ----
# sweep_cartesian.py 从此读取。列表 = 扫参，标量 = 固定。
# _ 前缀的 key 为扫参引擎配置，不参与笛卡尔积。
sweep:
  _n_jobs: 30                             # 并行 worker 数，-1 = 全部核心
  _out_dir: "F:\\重大作业考试\\26秋\\机械原理\\sweep_all"  # 输出根目录（相对项目根）

  # ---- 气动设计参数 ----
  alpha_front_deg:  [-15, 0, 15, 30, 45]   # 前翅安装角 [°]，5 值，步长 15°
  alpha_back_deg:   [-15, 0, 15, 30, 45]   # 后翅安装角 [°]，5 值，步长 15°
  phase_diff_deg:   [-180, -90, 0, 90, 180]  # 前后翅相位差 [°]，5 值，步长 90°
  
  # ---- 气动模型参数 ----
  k_clap:           [0.3, 0.5]         # Clap-and-Fling k_max，2 值扫参
  c_damp:           0.0005              # 俯仰气动阻尼 [N·m·s/rad]
  k_3d:             0.7                 # 3D 效应修正系数
  C_rot:            1.5                 # 旋转力系数
  r_rot:            0.5                 # 旋转力无量纲矩臂
  
  # ---- 机构参数 ----
  mech_a:           7.6                 # 翅膀转轴 A 的 y 坐标（曲柄半径）[mm]
  mech_b:           1.71                # 圆心 B 的 x 坐标 [mm]
  mech_R:           3.8                 # 摇杆半径 [mm]
  mech_c:           7.1                 # 连杆 P1-P2 长度 [mm]
  mech_l:           5.0                 # 摇杆/翅膀杆 A-P2 长度 [mm]
  phi_offset_deg:   [-30, -15, 0, 15, 30]  # 翅膀安装基准偏角 [°]，5 值，步长 15°
  rotation:         "cw"                # 曲柄旋转方向: cw=顺时针, ccw=逆时针
  
  # ---- 物理参数 ----
  f:                [10, 15]            # 扑动频率 [Hz]，2 值扫参
  rho:              1.225               # 空气密度 [kg/m³]，标准海平面
  m_total:          0.023               # 总质量 [kg]
  I_xx:             4.0668e-5           # 绕 X 轴（俯仰轴）转动惯量 [kg·m²]
  x_hinge_right:    0.009625             # 右翅铰链 X 坐标（相对 CG）[m]
  x_hinge_left:    -0.005935             # 左翅铰链 X 坐标（相对 CG）[m]
  y_hinge_rel:      0.002171             # 铰链 Y 坐标（相对 CG）[m]
  z_front:          0.036515             # 前翅力作用点 Z 坐标（相对 CG）[m]
  z_back:          -0.048012             # 后翅力作用点 Z 坐标（相对 CG）[m]
  g:                9.81                # 重力加速度 [m/s²]，方向 -Y

  # ---- 数值参数（扫参模式） ----
  dt:               5.0e-5              # 时间步长 [s]
  t_end:            5.0                 # 仿真总时长 [s]
  theta0_deg:       0.0                 # 初始俯仰角 [°]
  steady_start:     3.0                 # 稳态平均开始时间 [s]
