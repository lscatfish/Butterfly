# ============================================================
# Butterfly MAV — v6.9 设计参数（单一权威来源）
# ============================================================
#
# 本文件是所有仿真脚本的参数基准。修改此文件即可影响所有模块。
# 读取方式：
#   from src.config import get_design, get_mech_params
#   config = get_design()          # 完整 dict，同原 DESIGN_v69
#   mech   = get_mech_params()     # 仅机构参数 dict
#
# 参数来源：docs/机械结构更新报告.md（2026-07-03）
# 新机构：摆幅 ~99°，急回系数 K≈1.0，Grashof 条件满足
# 气动设计点：α_f=60°, α_b=3°, phase=-15°（扫参最优）
# ============================================================

version: "6.9"
description: >
  新四连杆机构参数（摆幅99°）+ 气动设计点优化（α_f=60°, α_b=3°, phase=-15°）。
  翅膀面积来自实测（翅膀的面积.xlsx），材料：PE薄膜膜面 + 碳纤维支撑杆 + 铝合金结构。

# ---- 四连杆机构几何参数 ----
# 曲柄摇杆机构，所有长度单位 mm
# Grashof: 3.8 + 7.79 = 11.59 ≤ 7.1 + 5.0 = 12.10 ✅
mechanism:
  a: 7.6             # 翅膀转轴 A 的 y 坐标 [mm]
  b: 1.71            # 圆心 B 的 x 坐标 [mm]
  R: 3.8             # 曲柄半径 [mm]（新：+52%）
  c: 7.1             # 连杆 P1-P2 长度 [mm]
  l: 5.0             # 摇杆/翅膀杆 A-P2 长度 [mm]
  phi_offset_deg: 0.0  # 翅膀安装基准偏角 [°]（新机构无偏移）
  rotation: cw         # 曲柄旋转方向：cw=顺时针, ccw=逆时针

# ---- 气动设计参数 ----
# 攻角定义（文献[32]）：α = η（相对拍动平面），上下拍符号翻转用 tanh 平滑
# Clap-and-Fling：速度-位置耦合（Lighthill 1973），k_max=0.3
# 设计点：α_f=60°, α_b=3°, phase=-15° 通过 4 参数单变量扫参确定
aero:
  alpha_front_deg: 60.0   # 前翅安装角 [°]（新：+15°, L/W=4.43, peak=65.8°）
  alpha_back_deg: 3.0     # 后翅安装角 [°]（新：-5°, 最稳定, peak=54.4°）
  phase_diff_deg: -15.0   # 前后翅相位差 [°]（新：+5°, 稳定区间中心）
  k_clap: 0.3             # Clap-and-Fling k_max（速度耦合系数）
  c_damp: 0.0005          # 俯仰气动阻尼 [N·m·s/rad]
  k_3d: 0.7               # 3D 效应修正系数
  C_rot: 1.5              # 旋转力系数
  r_rot: 0.5              # 旋转力无量纲矩臂

# ---- 物理常数 ----
# 质量 m=20g 暂未更新，待确认新材料下的实际质量
# 转动惯量 I_yy=3e-5 暂为估算值
physical:
  f: 17.0               # 扑动频率 [Hz]
  rho: 1.225             # 空气密度 [kg/m³]，标准海平面
  m_total: 0.020         # 总质量 [kg]（⚠️ 待实测更新）
  I_yy: 3.0e-5           # 绕 Y 轴转动惯量 [kg·m²]（⚠️ 待实测更新）
  d_cg: 0.015            # 重心在前翅转轴后方 [m]
  x_front: 0.025         # 前翅转轴距重心 X 方向 [m]（重心前方为正）
  x_back: -0.025         # 后翅转轴距重心 X 方向 [m]（重心后方为负）
  g: 9.81                # 重力加速度 [m/s²]

# ---- 数值仿真参数 ----
# dt=10μs 用于精度验证, dt=50μs 用于参数扫描（提速 5×）
numerical:
  dt: 1.0e-5             # 时间步长 [s]（精度模式）
  t_end: 10.0            # 仿真总时长 [s]
  theta0_deg: 0.0        # 初始俯仰角 [°]
  steady_start: 5.0      # 稳态平均开始时间 [s]

# ---- 笛卡尔积扫参网格 ----
# sweep_cartesian.py 从此读取网格。列表 = 扫参，标量 = 固定（不参与笛卡尔积）。
# 所有 SimulationConfig 字段均在此列出，注释标明每个参数的含义和来源。
sweep:
  # ---- 气动设计参数 ----
  alpha_front_deg:  [50, 55, 60, 70]   # 前翅安装角 [°]，4 值扫参（设计点 60）
  alpha_back_deg:   [3, 5, 8]          # 后翅安装角 [°]，3 值扫参（设计点 3）
  phase_diff_deg:   [-30, -20, -15, -10]  # 前后翅相位差 [°]，4 值扫参（设计点 -15）

  # ---- 气动模型参数 ----
  k_clap:           [0.3, 0.5]         # Clap-and-Fling k_max，2 值扫参（设计点 0.3）
  c_damp:           0.0005              # 俯仰气动阻尼 [N·m·s/rad]
  k_3d:             0.7                 # 3D 效应修正系数
  C_rot:            1.5                 # 旋转力系数
  r_rot:            0.5                 # 旋转力无量纲矩臂

  # ---- 机构参数 ----
  mech_a:           7.6                 # 翅膀转轴 A 的 y 坐标（曲柄半径）[mm]
  mech_b:           1.71                # 圆心 B 的 x 坐标 [mm]
  mech_R:           3.8                 # 摇杆半径 [mm]
  mech_c:           7.1                 # 连杆 P1-P2 长度 [mm]
  mech_l:           5.0                 # 摇杆/翅膀杆 A-P2 长度 [mm]
  phi_offset_deg:   0.0                 # 翅膀安装基准偏角 [°]（新机构无偏移）
  rotation:         "cw"                # 曲柄旋转方向: cw=顺时针, ccw=逆时针

  # ---- 物理参数 ----
  f:                17                  # 扑动频率 [Hz]
  rho:              1.225               # 空气密度 [kg/m³]，标准海平面
  m_total:          0.020               # 总质量 [kg]
  I_yy:             3.0e-5              # 绕 Y 轴转动惯量 [kg·m²]
  d_cg:             0.015               # 重心在前翅转轴后方 [m]
  x_front:          0.025               # 前翅转轴距重心 X 方向 [m]
  x_back:          -0.025               # 后翅转轴距重心 X 方向 [m]（重心后方为负）
  g:                9.81                # 重力加速度 [m/s²]

  # ---- 数值参数（扫参模式） ----
  dt:               5.0e-5              # 时间步长 [s]
  t_end:            5.0                 # 仿真总时长 [s]
  theta0_deg:       0.0                 # 初始俯仰角 [°]
  steady_start:     3.0                 # 稳态平均开始时间 [s]
